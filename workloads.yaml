# QFlex Workloads Configuration
# This file defines default settings and workload-specific configurations

default:
  version: "latest"
  experiment:
    name: "experiment_name_001"
    unique: false
  image:
    name: "root.qcow2"
    folder: "<IMAGE_FOLDER>"
    use_image_directly: false
  mounting_directory: "<MOUNT_DIR>"
  resources:
    cores:
      count: 8
      double_cores: true
    llc:
      size_per_tile_mb: 2
    memory:
      size_gb: 32
    network:
      type: "none"
    machine_freq_ghz: 2.0
    host_name: "ZEN3"
  simulation:
    parallel: true
    consolidated: false
    population: 30
    sample_size: 50
    ipc:
      primary_ipc: 2.0
      primary_core_start: 0
      phantom_cpu_ipc: 4
      secondary_ipc: null
      secondary_core_start: null
    quantum:
      quantum_size_ns: 2000
      check_period_quantum_coeff: 53.0
  s3:
    bucket_name: "11837-214f5313859d4e78b1365abfcebf7fcd"
    remote_path: "workloads"

