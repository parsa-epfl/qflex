# Init test fixture used by tests/test_real_runs_init.py — multi-node init.
# Boots both nodes, waits for each guest to reach its login prompt (followers
# touch a per-node sentinel; master waits for it), then the master savevm's
# `boot-login` which walks the PDES drain and persists every node's CPU+memory
# state into the corresponding per-node qcow2 (root-single-node-node{0,1}.qcow2).
# Subsequent multi-node real-run tests `loadvm` from those per-node snapshots.
#
# Shares per-node experiment_names with dc-multi-savevm-create.yaml /
# dc-multi-savevm-verify.yaml on purpose: QFlex's parallel-qemu savevm writes
# an external `boot-login.zstd` to the qemu cwd (`<exp>/run/`), and `loadvm`
# reads from there too — sharing the experiment folder keeps the .zstd
# co-located with the cwd of every subsequent run that loads from this snapshot.
#
# Names are prefixed `qflex_test_` so they're unique to the test world and
# can't clash with a user's real-experiment runs (which typically use the
# `data-caching-comparison*` defaults from conf/DC/dc-multi.yaml).
extends: ../../conf/DC/dc-multi

components:
  experiment_context:
    experiment_name: qflex_test_multi

  experiment_context_node_0:
    experiment_name: qflex_test_multi-node-0
    use_gdb: false
    interaction_script: /home/dev/qflex/tests/realrun/boot_login_savevm.exp
    serial_telnet_port: 55671
    telnet_port: 55771
    latencies_ns_list: [1000000]
    syncs_list: ["false"]

  experiment_context_node_1:
    experiment_name: qflex_test_multi-node-1
    use_gdb: false
    interaction_script: /home/dev/qflex/tests/realrun/boot_login_wait.exp
    serial_telnet_port: 55672
    telnet_port: 55772
    latencies_ns_list: [1000000]
    syncs_list: ["false"]
