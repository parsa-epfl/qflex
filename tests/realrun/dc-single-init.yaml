# Single-node init: boots Alpine, waits for the login prompt, savevm's the
# running guest as `boot-login` into root-single-node.qcow2, then quits.
# Subsequent regular real-run tests pick that snapshot up via
# `loadvm_name: boot-login` in dc-single-alpine.yaml so they skip the multi-
# minute boot.
#
# Shares experiment_name with dc-single-alpine.yaml on purpose: QFlex's
# parallel-qemu savevm writes an external `<name>.zstd` file in the qemu cwd
# (`<exp>/run/`), and `loadvm <name>` reads from there too. Sharing the
# experiment folder keeps the .zstd co-located with the cwd of every
# subsequent run that loads from this snapshot.
extends: test-base-single

components:
  experiment_context:
    experiment_name: qflex_real_run_test
    use_gdb: false
    interaction_script: /home/dev/qflex/tests/realrun/boot_login_savevm.exp
    serial_telnet_port: 55661
    telnet_port: 55761
