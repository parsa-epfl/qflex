# Test fixture used by tests/test_real_runs_savevm.py::test_01.
# Per the master/non-master split rule, the two leaves use different scripts:
#   - node 0 (master) drives savevm + writes the savevm-done sentinel.
#   - node 1 (non-master) waits on the sentinel before quitting.
# All knobs the test relies on (use_gdb, interaction_script) live in this YAML;
# the python test file doesn't pass any flags.
extends: ../../conf/DC/dc-multi

components:
  # Override the parent group + per-node experiment_names so they're unique to
  # the test world (`qflex_test_*`) and can't clash with a user's real run that
  # uses the `data-caching-comparison*` defaults from conf/DC/dc-multi.yaml.
  # Shared with dc-multi-boot-login-init.yaml / dc-multi-savevm-verify.yaml so
  # all three tests `cd` into the same per-node `<exp>/run/` and pick up the
  # same boot-login.zstd written there by init.
  experiment_context:
    experiment_name: qflex_test_multi

  experiment_context_node_0:
    experiment_name: qflex_test_multi-node-0
    use_gdb: false
    interaction_script: /home/dev/qflex/tests/realrun/boot_create_and_savevm_master.exp
    serial_telnet_port: 55621
    telnet_port: 55721
    # Load the per-node snapshot bootstrapped by test_real_runs_init.py's
    # multi-node init so the guest comes up at the login prompt instead of
    # going through a full PDES-paced Alpine boot (much slower than single-node).
    loadvm_name: boot-login
    latencies_ns_list: [1000000]
    syncs_list: ["false"]

  experiment_context_node_1:
    experiment_name: qflex_test_multi-node-1
    use_gdb: false
    interaction_script: /home/dev/qflex/tests/realrun/boot_create_and_wait.exp
    serial_telnet_port: 55612
    telnet_port: 55712
    loadvm_name: boot-login
    latencies_ns_list: [1000000]
    syncs_list: ["false"]
