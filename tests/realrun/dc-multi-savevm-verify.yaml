# Test fixture used by tests/test_real_runs_savevm.py::test_02 — companion to
# dc-multi-savevm-create.yaml. Each leaf restores via `-loadvm qflex-makefile-test`
# and runs the same load+ls driver. All knobs live in YAML; the python test
# doesn't pass any flags.
extends: ../../conf/DC/dc-multi

components:
  # See dc-multi-savevm-create.yaml for the rationale on the qflex_test_*
  # prefix. We share these names across multi-node tests so the per-node qcow2s
  # (which carry both `boot-login` from init and `qflex-makefile-test` from
  # test_01) sit next to one set of reusable run/ folders.
  experiment_context:
    experiment_name: qflex_test_multi

  experiment_context_node_0:
    experiment_name: qflex_test_multi-node-0
    use_gdb: false
    interaction_script: /home/dev/qflex/tests/realrun/load_verify_ls.exp
    loadvm_name: qflex-makefile-test
    serial_telnet_port: 55631
    telnet_port: 55731

  experiment_context_node_1:
    experiment_name: qflex_test_multi-node-1
    use_gdb: false
    interaction_script: /home/dev/qflex/tests/realrun/load_verify_ls.exp
    loadvm_name: qflex-makefile-test
    serial_telnet_port: 55632
    telnet_port: 55732
