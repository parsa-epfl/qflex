# SINGLE multi-node real-run YAML — drives every non-init multi-node test phase
# via top-level command sections. The python tests just `./qflex <phase> -c
# tests/realrun/dc-multi.yaml`; no CLI flags. (Init bootstrap of `boot-login`
# is separately gated by QFLEX_INIT_TEST and lives in tests/realrun/dc-multi-init.yaml
# — that flow's per-leaf interaction_script is asymmetric in a way command
# sections can't express, so it stays separate.)
#
# Phase-specific fields (interaction_script, loadvm_name, partition_count, …)
# live in the phase blocks below — the leaves only carry what's invariant
# across phases (experiment_name, telnet ports, use_gdb). Each phase block
# uses `_leaf_defaults: {...}` for rule-level changes and `components.<name>:`
# for per-leaf scoping; flat-key broadcast is no longer accepted.
extends: test-base-multi

components:
  experiment_context:
    experiment_name: qflex_test_multi

  experiment_context_node_0:
    experiment_name: qflex_test_multi-node-0
    use_gdb: false
    serial_telnet_port: 55681
    telnet_port: 55781

  experiment_context_node_1:
    experiment_name: qflex_test_multi-node-1
    use_gdb: false
    serial_telnet_port: 55682
    telnet_port: 55782

# Boot: relaxed wire (Alpine freezes under sync=true / 100us), loadvm boot-login,
# per-node interaction scripts (master/follower differ). latencies_ns_list and
# syncs_list are hardcoded per-leaf in conf/DC/dc-multi.yaml so the override
# has to land on the component, not on _leaf_defaults.
boot:
  _leaf_defaults:
    loadvm_name: boot-login
  components:
    experiment_context_node_0:
      latencies_ns_list: [1000000]
      syncs_list: ["false"]
      interaction_script: /home/dev/qflex/tests/realrun/loaded_test_create_master.exp
    experiment_context_node_1:
      latencies_ns_list: [1000000]
      syncs_list: ["false"]
      interaction_script: /home/dev/qflex/tests/realrun/loaded_test_create_follower.exp

# Load: same script for both leaves; re-savevms loaded-test with a long-running
# urandom→TCP-echo→cmp workload running, so init/fw resume from a snapshot
# where the workload is already churning (their warming phases see real
# CPU+network activity).
load:
  _leaf_defaults:
    interaction_script: /home/dev/qflex/tests/realrun/loaded_test_verify_and_swap_workload.exp
    loadvm_name: loaded-test

# Pipeline phases — each loads loaded-test or init_warmed; interaction_script
# is left at the factory default ("") which keeps QEMU on its default
# (mon:stdio) channels, no auto-telnet-monitor.
initialize:
  _leaf_defaults:
    loadvm_name: loaded-test

fw:
  _leaf_defaults:
    loadvm_name: init_warmed

partition:
  _leaf_defaults:
    partition_count: 5

run_idx:
  _leaf_defaults:
    partition_number: 0
    idx: 0

run_single_partition:
  _leaf_defaults:
    partition_number: 0
