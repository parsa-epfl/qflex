extends: ws-multi


components:
  experiment_context:
    _base_: _leaf_defaults
    experiment_name: web-search-multi-node-0-low-latency
    _deps_:
      sub_experiments:
        - name: node_0
        - name: node_1

  experiment_context_node_0:
    _base_: _leaf_defaults
    _name_: node_0
    experiment_name: web-search-node-0-0-low-latency
    node_number: 0
    neighbor_node_list: [1]
    pdes_net_devs: ["virtio-net-pci"]
    latencies_ns_list: [10000]
    syncs_list: ["true"]
    image_name: root-single-multi-node-0-low-latency.qcow2

  experiment_context_node_1:
    _base_: _leaf_defaults
    _name_: node_1
    experiment_name: web-search-node-1-0-low-latency
    node_number: 1
    neighbor_node_list: [0]
    pdes_net_devs: ["virtio-net-pci"]
    latencies_ns_list: [10000]
    syncs_list: ["true"]
    image_name: root-single-multi-node-1-low-latency.qcow2
    wait_for_nodes: [0]
