extends: ../WS_base

components:
  experiment_context:
    _base_: _leaf_defaults
    experiment_name: web-search-single-node-0
    doubled_vcpu: true
    phantom_cpu_ipc: 4
    latencies_ns_list: [1000000]
    syncs_list: ["false"]
    image_name: root.qcow2
    server_cores: "0-0"
    client_cores: "1-1"


boot:
  components:
    experiment_context:
      interaction_script: /home/dev/qflex/conf/WS/single_node/expects/boot_savevm_booted_single.exp

load:
  components:
    experiment_context:
      interaction_script: /home/dev/qflex/conf/WS/single_node/expects/load_savevm_loaded_single.exp.j2
      loadvm_name: booted

initialize:
  components:
    experiment_context:
      loadvm_name: loaded


# TODO see if you have to pass in sample size 3 times or not
fw:
  components:
    experiment_context:
      loadvm_name: init_warmed
