extends: ws-multi

_leaf_defaults:
  image_folder: /mnt/sdc/web-search-temp/
  mounting_folder: /mnt/sdc/web-search-temp/
  image_name: root-ws.qcow2

components:
  experiment_context:
    _base_: _leaf_defaults
    experiment_name: web-search-multi-node-yaml-test-0
    _deps_:
      sub_experiments:
        - name: node_0
        - name: node_1

  experiment_context_node_0:
    _base_: _leaf_defaults
    _name_: node_0
    experiment_name: web-search-node-0-yaml-test-0
    node_number: 0
    neighbor_node_list: [1]
    pdes_net_devs: ["virtio-net-pci"]
    latencies_ns_list: [100000]
    syncs_list: ["true"]

  experiment_context_node_1:
    _base_: _leaf_defaults
    _name_: node_1
    experiment_name: web-search-node-1-yaml-test-0
    node_number: 1
    neighbor_node_list: [0]
    pdes_net_devs: ["virtio-net-pci"]
    latencies_ns_list: [100000]
    syncs_list: ["true"]
    wait_for_nodes: [0]

