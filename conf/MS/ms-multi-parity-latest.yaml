# Parity harness, label "latest": the branch-head build (see parity-switch-latest-tmp.sh) of the same topology.
# Phase C1 rewrites this file to the nics: schema (see harness-temp.md); until then the legacy
# lists inherited from ms-multi describe the identical 2-node wire.
extends: ms-multi

_leaf_defaults:
  mounting_folder: /mnt/sdc/testing/parity/
  image_folder: /mnt/sdc/testing/parity/images-latest/
  binaries_folder: /mnt/sdc/testing/parity/builds/latest
  # Determinism: virtio-net TX on a VIRTUAL timer + no ioeventfd (see tmp-non-det.md). Every phase.
  pdes_nic_opts: ",ioeventfd=off,tx=timer,x-txtimer=0"

components:
  experiment_context:
    experiment_name: media-streaming-multi-node-0-parity-latest
  experiment_context_node_0:
    experiment_name: media-streaming-node-0-0-parity-latest
  experiment_context_node_1:
    experiment_name: media-streaming-node-1-0-parity-latest

# Interrupt-trace probe for the timing phases (diagnostic only; lands in qemu-timing.log).
run_idx:
  _leaf_defaults:
    extra_qemu_args: "-d nochain,int -trace enable=gicv3_icc_iar1_read"
run_single_partition:
  _leaf_defaults:
    extra_qemu_args: "-d nochain,int -trace enable=gicv3_icc_iar1_read"
run_partition:
  _leaf_defaults:
    extra_qemu_args: "-d nochain,int -trace enable=gicv3_icc_iar1_read"
