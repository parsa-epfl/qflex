extends: MS_base

_leaf_defaults:
  partition_count: 46

components:
  experiment_context:
    _base_: _leaf_defaults
    experiment_name: media-streaming-single-node-0
    doubled_vcpu: true
    phantom_cpu_ipc: 4
    latencies_ns_list: [1000000]
    syncs_list: ["false"]
    memory_gb: 64
    original_image_name: root.qcow2
    image_name: root-single.qcow2
    # 2000 sampling units at a 0.5 % acceptable error, matching the 2-NIC and 2-node runs (MS_base: 500 / 5 %).
    sample_size: 2000
    acceptable_error: 0.005
    # the same Oct 14 build the 2-NIC and 2-node runs used (the container's -saved trees are the image's older binaries)
    binaries_folder: /mnt/sdb/multi-node-experiments/builds/single2nic


# epoch_0
# base
boot:
  components:
    experiment_context:
      interaction_script: /home/dev/qflex/conf/MS/expects/boot_savevm_booted_single.exp

load:
  components:
    experiment_context:
      interaction_script: /home/dev/qflex/conf/MS/expects/load_savevm_loaded_single.exp
      loadvm_name: booted

initialize:
  components:
    experiment_context:
      loadvm_name: loaded


# TODO see if you have to pass in sample size 3 times or not
fw:
  components:
    experiment_context:
      loadvm_name: init_warmed
