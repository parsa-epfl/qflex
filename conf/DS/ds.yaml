extends: DS_base

_leaf_defaults:
  partition_count: 46

components:
  experiment_context:
    _base_: _leaf_defaults
    experiment_name: data-serving-single-node-0
    doubled_vcpu: true
    phantom_cpu_ipc: 4
    latencies_ns_list: [1000000]
    syncs_list: ["false"]
    memory_gb: 64
    original_image_name: root.qcow2
    image_name: root-single.qcow2


# epoch_0
# base
boot:
  components:
    experiment_context:
      quantum_size: 100000
      interaction_script: /home/dev/qflex/conf/DS/expects/boot_savevm_booted_single.exp

load:
  components:
    experiment_context:
      interaction_script: /home/dev/qflex/conf/DS/expects/load_savevm_loaded_single.exp
      loadvm_name: booted

initialize:
  components:
    experiment_context:
      loadvm_name: loaded


# TODO see if you have to pass in sample size 3 times or not
fw:
  components:
    experiment_context:
      loadvm_name: init_warmed
