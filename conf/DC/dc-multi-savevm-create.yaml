# Test fixture used by tests/test_real_runs_savevm.py — extends dc-multi.yaml
# and sets a DIFFERENT `interaction_script` per leaf:
#
#   - node 0 (master) → boot_create_and_savevm_master.exp
#         creates test1.txt, ls's, then issues `savevm qflex-makefile-test`
#         on its monitor. Multi-node `savevm` drains across all nodes; only
#         the master sends the command.
#
#   - node 1 (non-master) → boot_create_and_wait.exp
#         creates test2.txt, ls's, then BLOCKS on the master's savevm-done
#         sentinel before quitting. Quitting earlier would tear down the
#         PDES wire mid-drain and leave a corrupt snapshot.
#
# This master/non-master split is mandatory whenever an interaction_script
# wants to drive a snapshot under multi-node — see CLAUDE.md "Multi-node
# specifics" for the rule.

extends: dc-multi

components:
  experiment_context_node_0:
    interaction_script: /home/dev/qflex/sample_scripts/boot_create_and_savevm_master.exp

  experiment_context_node_1:
    interaction_script: /home/dev/qflex/sample_scripts/boot_create_and_wait.exp
