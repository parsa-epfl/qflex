extends: DC_base

# Optional per-leaf hooks for boot/load only (other phases ignore these):
#   experiment_context_node_0:
#     interaction_script: ./scripts/setup_node_0.exp   # Path A: drive QEMU automatically.
#     # OR
#     interactive_tmux: true                            # Path B: open a tmux window per leaf.

components:
  experiment_context:
    _base_: _leaf_defaults
    experiment_name: data-caching-comparison
    _deps_:
      sub_experiments:
        - name: node_0
        - name: node_1

  experiment_context_node_0:
    _base_: _leaf_defaults
    _name_: node_0
    experiment_name: data-caching-comparison-node-0
    node_number: 0
    neighbor_node_list: [1]
    pdes_net_devs: ["virtio-net-pci"]
    latencies_ns_list: [100000]
    syncs_list: ["true"]

  experiment_context_node_1:
    _base_: _leaf_defaults
    _name_: node_1
    experiment_name: data-caching-comparison-node-1
    node_number: 1
    neighbor_node_list: [0]
    pdes_net_devs: ["virtio-net-pci"]
    latencies_ns_list: [100000]
    syncs_list: ["true"]
    wait_for_nodes: [0]

# Per-phase overlays. _leaf_defaults under a phase block deep-merges into the
# top-level _leaf_defaults inherited from DC_base *before* `_base_:` resolves
# on each component, so every node leaf picks up the right value when its
# phase is active. Component-level overrides win over _leaf_defaults — so the
# latencies_ns_list / syncs_list values hardcoded on experiment_context_node_*
# above need to be overridden component-by-component, not via _leaf_defaults.

# Boot: relaxed wire (sync=true / 100us deadlocks Alpine) + tmux for per-leaf
# interactivity. Phase invariant — keep here so any user pointing boot.sh at
# this YAML gets the right behavior.
boot:
  _leaf_defaults:
    interactive_tmux: true
  components:
    experiment_context_node_0:
      latencies_ns_list: [1000000]
      syncs_list: ["false"]
    experiment_context_node_1:
      latencies_ns_list: [1000000]
      syncs_list: ["false"]

load:
  _leaf_defaults:
    interactive_tmux: true

fw:
  _leaf_defaults:
    sample_size: 10

run_partition:
  _leaf_defaults:
    warming_ratio: 2
    measurement_ratio: 8

run_single_partition:
  _leaf_defaults:
    warming_ratio: 2
    measurement_ratio: 8

run_idx:
  _leaf_defaults:
    warming_ratio: 2
    measurement_ratio: 8
